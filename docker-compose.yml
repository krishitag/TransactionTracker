# Local development database. Start with: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 with the pgvector extension included
    container_name: risk-postgres
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk_dev_password
      POSTGRES_DB: risk
    ports:
      - "5433:5432"   # 5433 on the host so it doesn't clash with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk -d risk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
